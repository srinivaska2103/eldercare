<!DOCTYPE html>
<html lang="en" x-data="authApp()" :class="{ 'dark': darkMode }" :dir="isRtl ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23008080' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>">
    <title>Sign Up | ElderCare Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0D9488',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <nav class="p-6 flex justify-between items-center w-full max-w-7xl mx-auto">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-primary p-1.5 rounded-lg text-white group-hover:scale-110 transition-transform">
                <i data-lucide="heart" class="w-6 h-6"></i>
            </div>
            <span class="text-2xl font-bold text-primary">ElderCare</span>
        </a>

        <div class="flex items-center gap-4">
            <button @click="toggleRtl()" class="px-3 py-1.5 rounded-lg bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 text-xs font-bold hover:border-primary transition-colors" x-text="isRtl ? 'LTR' : 'RTL'"></button>
            
            <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 hover:border-primary transition-colors">
                <i x-show="!darkMode" data-lucide="moon" class="w-5 h-5"></i>
                <i x-show="darkMode" data-lucide="sun" class="w-5 h-5 text-amber-400"></i>
            </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-gray-900 rounded-[2.5rem] shadow-2xl p-8 md:p-12 border border-gray-100 dark:border-gray-800 relative overflow-hidden my-8">
            
            <div class="mb-10 text-center lg:text-start">
                <h1 class="text-3xl  text-center mb-2">Create Account</h1>
                <!-- <p class="text-gray-500 dark:text-gray-400">Join our community of compassionate care.</p> -->
            </div>

            <form action="index.html" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-sm font-bold ml-1">Full Name</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" required placeholder="Srinivas K A"
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-gray-200 dark:bg-gray-800 dark:border-gray-700 focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold ml-1">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="email" required placeholder="name@example.com"
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-gray-200 dark:bg-gray-800 dark:border-gray-700 focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white">
                    </div>
                </div>

                <div class="space-y-2" x-data="{ show: false }">
                    <label class="text-sm font-bold ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input :type="show ? 'text' : 'password'" required placeholder="••••••••"
                            class="w-full pl-12 pr-12 py-4 rounded-2xl border border-gray-200 dark:bg-gray-800 dark:border-gray-700 focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white">
                        <button type="button" @click="show = !show" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors">
                            <i x-show="!show" data-lucide="eye" class="w-5 h-5"></i>
                            <i x-show="show" data-lucide="eye-off" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-start gap-2 text-sm px-1 pt-2">
                    <input type="checkbox" required id="terms" class="mt-1 w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer">
                    <label for="terms" class="text-gray-600 dark:text-gray-400 leading-tight cursor-pointer">
                        I agree to the <a href="#" class="text-primary font-bold hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-bold hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="w-full bg-primary text-white py-4 rounded-2xl font-bold text-lg hover:bg-teal-700 shadow-xl shadow-teal-200/50 dark:shadow-none active:scale-[0.98] transition-all">
                    Create Account
                </button>
            </form>

            <div class="relative my-8 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-800"></div></div>
                <span class="relative bg-white dark:bg-gray-900 px-4 text-xs text-gray-400 uppercase tracking-widest font-bold">Or sign up with</span>
            </div>

            <div class="flex justify-center gap-4">
                <button class="p-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-primary transition-all">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16">
  <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
</svg>                </button>
                <button class="p-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-primary transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
  <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
</svg>
                </button>
                <button class="p-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-primary transition-all">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-apple" viewBox="0 0 16 16">
  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/>
</svg>                </button>
            </div>

            <p class="mt-8 text-center text-gray-500">
                Already have an account? 
                <a href="login.html" class="text-primary font-bold hover:underline">Sign in instead</a>
            </p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js" onload="lucide.createIcons();"></script>
    <script>
        function authApp() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                isRtl: localStorage.getItem('isRtl') === 'true',
                
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                },
                
                toggleRtl() {
                    this.isRtl = !this.isRtl;
                    localStorage.setItem('isRtl', this.isRtl);
                },

                init() {
                    lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
