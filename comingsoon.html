<!DOCTYPE html>
<html lang="en" x-data="comingSoonApp()" :class="{ 'dark': darkMode }" :dir="isRtl ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23008080' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>">
    <title>Coming Soon | ElderCare Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0D9488',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <nav class="p-6 flex justify-between items-center w-full max-w-7xl mx-auto">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-primary p-1.5 rounded-lg text-white group-hover:scale-110 transition-transform">
                <i data-lucide="heart" class="w-6 h-6"></i>
            </div>
            <span class="text-2xl font-bold text-primary">ElderCare</span>
        </a>

        <div class="flex items-center gap-4">
            <button @click="toggleRtl()" class="px-3 py-1.5 rounded-lg bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 text-xs font-bold hover:border-primary transition-colors" x-text="isRtl ? 'LTR' : 'RTL'"></button>
            
            <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 hover:border-primary transition-colors">
                <i x-show="!darkMode" data-lucide="moon" class="w-5 h-5"></i>
                <i x-show="darkMode" data-lucide="sun" class="w-5 h-5 text-amber-400"></i>
            </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-4xl w-full text-center">
            
            <span class="inline-block px-4 py-1.5 rounded-full bg-primary/10 text-primary font-bold text-sm mb-6 uppercase tracking-widest backdrop-blur-sm">
                Exciting Things are Coming
            </span>

            <h1 class="text-4xl md:text-6xl lg:text-7xl font-black text-gray-900 dark:text-white leading-tight mb-8">
                We're Crafting a Better <br>
                <span class="text-primary">Care Experience</span>
            </h1>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-2xl mx-auto mb-12" x-data="countdown()">
                <template x-for="(value, label) in time" :key="label">
                    <div class="bg-white dark:bg-gray-900 p-4 md:p-6 rounded-[2rem] shadow-xl border border-gray-100 dark:border-gray-800">
                        <div class="text-3xl md:text-5xl font-black text-primary mb-1" x-text="value">00</div>
                        <div class="text-xs md:text-sm font-bold text-gray-400 uppercase tracking-widest" x-text="label"></div>
                    </div>
                </template>
            </div>

            <div class="max-w-md mx-auto relative group" x-data="{ subscribed: false }">
                <div x-show="!subscribed" x-transition>
                    <p class="text-gray-500 dark:text-gray-400 mb-6 font-medium">Be the first to know when we launch. No spam, just care.</p>
                    <form @submit.prevent="subscribed = true" class="relative">
                        <input type="email" required placeholder="Enter your email address"
                            class="w-full pl-6 pr-36 py-5 rounded-full border border-gray-200 dark:bg-gray-900 dark:border-gray-800 focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white shadow-lg">
                        <button type="submit" class="absolute right-2 top-2 bottom-2 bg-primary text-white px-8 rounded-full font-bold hover:bg-teal-700 transition-all active:scale-95">
                            Notify Me
                        </button>
                    </form>
                </div>

                <div x-show="subscribed" x-cloak x-transition class="p-6 bg-teal-50 dark:bg-teal-900/20 rounded-3xl border border-primary/20">
                    <div class="flex items-center justify-center gap-3 text-primary font-bold">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                        <span>You're on the list! We'll be in touch soon.</span>
                    </div>
                </div>
            </div>

            <div class="mt-16 flex justify-center gap-6">
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><i data-lucide="facebook"></i></a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><i data-lucide="twitter"></i></a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><i data-lucide="instagram"></i></a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><i data-lucide="linkedin"></i></a>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center text-sm text-gray-400">
        © 2026 ElderCare Services. Something big is happening.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js" onload="lucide.createIcons();"></script>
    <script>
        function comingSoonApp() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                isRtl: localStorage.getItem('isRtl') === 'true',
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                },
                toggleRtl() {
                    this.isRtl = !this.isRtl;
                    localStorage.setItem('isRtl', this.isRtl);
                },
                init() { lucide.createIcons(); }
            }
        }

        function countdown() {
            return {
                time: { Days: '00', Hours: '00', Min: '00', Sec: '00' },
                expiry: new Date().getTime() + (15 * 24 * 60 * 60 * 1000), // 15 days from now
                init() {
                    setInterval(() => {
                        let now = new Date().getTime();
                        let d = this.expiry - now;
                        this.time.Days = Math.floor(d / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                        this.time.Hours = Math.floor((d % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                        this.time.Min = Math.floor((d % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                        this.time.Sec = Math.floor((d % (1000 * 60)) / 1000).toString().padStart(2, '0');
                    }, 1000);
                }
            }
        }
    </script>
</body>
</html>
